<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notre galerie</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body>
    <!-- NAVBAR — partagée sur les 3 pages -->
    <header>
      <img class="header-img" src="/assets/images/Logo.png" alt="Logo" />
      <p class="h6">Céramique artisanale, faite main à Lyon</p>
      <nav>
        <a href="/index.html"> Accueil </a>
        <a href="/galerie.html"> Galerie </a>
        <a href="/contact.html"> Contact </a>
      </nav>
    </header>
    <main>
      <section class="py-6">
        <div class="container">
          <h2 class="text-center mb-5">Nous contacter</h2>
          <div class="row">
            <div class="col-md-6">
              <form>
                <label for="prenom">Prénom *</label>
                <input
                  type="text"
                  class="form-control"
                  id="prenom"
                  required
                  placeholder="Votre prénom"
                />

                <label for="nom">Nom *</label>
                <input
                  type="text"
                  class="form-control"
                  id="nom"
                  required
                  placeholder="Votre nom"
                />

                <label for="email">Email *</label>
                <input
                  type="email"
                  class="form-control"
                  id="email"
                  required
                  placeholder="votre@email.com"
                />

                <label for="message">Message *</label>
                <textarea
                  class="form-control"
                  id="message"
                  rows="5"
                  required
                  minlength="20"
                  placeholder="Votre message"
                ></textarea>
                <div class="mb-3">
                  <label for="sujet">Sujet</label>
                  <select
                    class="form-select"
                    id="sujet"
                    title="Sujet de votre message"
                  >
                    <option>Info</option>
                    <option>Commande</option>
                    <option>Autre</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label>Message *</label>

                  <textarea
                    class="form-control"
                    rows="5"
                    required
                    minlength="20"
                    placeholder="Votre message (20 caractères minimum)"
                  ></textarea>
                </div>
                <div class="mb-3 form-check">
                  <input
                    type="checkbox"
                    class="form-check-input"
                    id="consent"
                    required
                  />
                  <label class="form-check-label" for="consent">
                    J'accepte le traitement de mes données *
                  </label>
                </div>
                <button type="submit" class="btn btn-warning">
                  Envoyer ma demande
                </button>
              </form>
            </div>
              <div class="col-md-5 informations">
              <h5>Infos pratiques</h5>
              <p>📍 12 rue de la Céramique, Lyon</p>
              <p>📞 04 67 00 00 00</p>
              <p>✉ contact@atelier-ceramique.fr</p>
                <iframe title="Carte de l'atelier" src="https://www.google.com/maps/embed?pb=!1m16!1m12!1m3!1d6693.647972815062!2d4.827617798118045!3d45.767545154602026!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!2m1!1s%2012%20rue%20de%20la%20C%C3%A9ramique%2C%20Lyon!5e1!3m2!1sfr!2sfr!4v1779997614033!5m2!1sfr!2sfr" width="600" height="450" frameborder="0" allowfullscreen loading="lazy"></iframe>
            </div>
          </div>
        </div>
      
      </section>
    </main>
    <footer>
      <div class="footer">
        <div>
          <h4>Adresse</h4>
          <p class="card-text"> 📍 12 rue de la Céramique, Lyon </p>
        </div>
        <div>
          <h4>Contact</h4>
          <p class="card-text"> 📞 04 67 00 00 00</p>
        </div>
        <div class="footer-socialmedia">
          <h4>Réseaux</h4>
          <a href="#" target="_blank" rel="noopener" title="Instagram"><i class="bi bi-instagram"></i></a>
          <a href="#" target="_blank" rel="noopener" title="Facebook"><i class="bi bi-facebook"></i></a>
          <a href="#" target="_blank" rel="noopener" title="Pinterest"><i class="bi bi-pinterest"></i></a>
      </div>
      </div>
      </div>
    </footer>
  </body>
</html>
